<svg width="1280" height="190" viewBox="0 0 1280 190" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="190">
      <stop stop-color="#050912"/>
      <stop offset=".5" stop-color="#091322"/>
      <stop offset="1" stop-color="#050912"/>
    </linearGradient>
    <linearGradient id="line" x1="80" y1="0" x2="1200" y2="0">
      <stop stop-color="#22D3EE"/>
      <stop offset=".5" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }
      .beam { animation:beam 5s ease-in-out infinite; }
      .pulse { animation:pulse 2.8s ease-in-out infinite; }
      .p2 { animation-delay:.9s; } .p3 { animation-delay:1.8s; }
      @keyframes beam { 0%,12%{transform:translateX(-1100px);opacity:0} 25%{opacity:.7} 62%{transform:translateX(1100px);opacity:0} 100%{transform:translateX(1100px);opacity:0} }
      @keyframes pulse { 0%,100%{opacity:.35} 50%{opacity:1} }
      @media (prefers-reduced-motion: reduce) { * { animation:none!important; } }
    </style>
  </defs>
  <rect width="1280" height="190" rx="22" fill="url(#bg)"/>
  <path d="M80 46H1200" stroke="#17233A"/>
  <path d="M80 46H1200" stroke="url(#line)" stroke-opacity=".45"/>
  <circle cx="80" cy="46" r="5" fill="#22D3EE" filter="url(#glow)" class="pulse"/>
  <circle cx="640" cy="46" r="5" fill="#3B82F6" filter="url(#glow)" class="pulse p2"/>
  <circle cx="1200" cy="46" r="5" fill="#A78BFA" filter="url(#glow)" class="pulse p3"/>
  <rect class="beam" x="-120" y="38" width="140" height="16" fill="url(#line)" opacity="0" filter="url(#glow)"/>

  <text x="640" y="105" text-anchor="middle" class="sans" font-size="28" font-weight="800" letter-spacing="-.4" fill="#EDF4FC">
    Build useful systems. Remove friction. Ship with intent.
  </text>
  <text x="640" y="138" text-anchor="middle" class="mono" font-size="11.5" font-weight="700" letter-spacing="2" fill="#6F829C">
    AMEER-JAMAL / SOFTWARE ENGINEERING / OPEN SOURCE
  </text>
  <rect x=".5" y=".5" width="1279" height="189" rx="21.5" stroke="#243247"/>
</svg>