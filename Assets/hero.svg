      </text>

      <g class="float-a">
        <circle cx="980" cy="282" r="144" stroke="#3B82F6" stroke-opacity=".11"/>
        <circle cx="980" cy="282" r="118" stroke="#8B5CF6" stroke-opacity=".15" stroke-dasharray="3 11"/>
        <circle cx="980" cy="282" r="92" stroke="#22D3EE" stroke-opacity=".13"/>
      </g>

      <g class="orbit-slow">
        <ellipse cx="980" cy="282" rx="174" ry="78" transform="rotate(-18 980 282)" stroke="#3B82F6" stroke-opacity=".28" stroke-width="1.2" stroke-dasharray="6 11"/>
        <circle cx="817" cy="334" r="4.5" fill="#38BDF8" filter="url(#glowStrong)"/>
        <circle cx="1143" cy="230" r="4.5" fill="#A78BFA" filter="url(#glowStrong)"/>
      </g>

      <g class="orbit-reverse">
        <ellipse cx="980" cy="282" rx="154" ry="112" transform="rotate(29 980 282)" stroke="#8B5CF6" stroke-opacity=".22" stroke-width="1.1" stroke-dasharray="4 13"/>
        <circle cx="1094" cy="389" r="4.2" fill="#60A5FA" filter="url(#glowStrong)"/>
        <circle cx="866" cy="175" r="4.2" fill="#C4B5FD" filter="url(#glowStrong)"/>
      </g>

      <path d="M875 181C910 205 925 225 946 248" stroke="#60A5FA" stroke-opacity=".42" class="dash-flow"/>
      <path d="M1085 179C1053 209 1034 224 1014 250" stroke="#A78BFA" stroke-opacity=".42" class="dash-flow-reverse"/>
      <path d="M875 379C913 351 928 335 950 314" stroke="#22D3EE" stroke-opacity=".42" class="dash-flow-reverse"/>
      <path d="M1085 379C1052 350 1037 334 1011 314" stroke="#60A5FA" stroke-opacity=".42" class="dash-flow"/>

      <g filter="url(#glowSoft)" opacity=".7">
        <circle cx="980" cy="282" r="67" fill="#2563EB" opacity=".36"/>
      </g>
      <circle cx="980" cy="282" r="59" fill="url(#core)" stroke="#7DD3FC" stroke-opacity=".72"/>
      <circle cx="980" cy="282" r="49" fill="#07101F" fill-opacity=".54" stroke="#BAE6FD" stroke-opacity=".24"/>
      <text x="980" y="298" text-anchor="middle" class="sans" font-size="43" font-weight="900" letter-spacing="-2" fill="#F8FAFC">AJ</text>
      <circle cx="980" cy="282" r="71" stroke="#60A5FA" stroke-opacity=".28" class="pulse"/>
      <circle cx="980" cy="282" r="78" stroke="#A78BFA" stroke-opacity=".18" class="pulse pulse-delay-2"/>

      <g filter="url(#panelShadow)">
        <rect x="792" y="139" width="154" height="69" rx="15" fill="#0B1524" stroke="#244365"/>
        <circle cx="812" cy="161" r="5" fill="#38BDF8" class="pulse"/>
        <text x="827" y="165" class="mono" font-size="10" font-weight="800" letter-spacing="1.3" fill="#BAE6FD">FRONTEND</text>
        <text x="812" y="190" class="sans" font-size="11.5" fill="#8294AB">Angular · TypeScript</text>

        <rect x="1014" y="139" width="154" height="69" rx="15" fill="#0B1524" stroke="#3C2B63"/>
        <circle cx="1034" cy="161" r="5" fill="#A78BFA" class="pulse pulse-delay-1"/>
        <text x="1049" y="165" class="mono" font-size="10" font-weight="800" letter-spacing="1.3" fill="#DDD6FE">BACKEND</text>
        <text x="1034" y="190" class="sans" font-size="11.5" fill="#8294AB">Java · Spring Boot</text>

        <rect x="792" y="356" width="154" height="69" rx="15" fill="#0B1524" stroke="#1E5264"/>
        <circle cx="812" cy="378" r="5" fill="#22D3EE" class="pulse pulse-delay-2"/>
        <text x="827" y="382" class="mono" font-size="10" font-weight="800" letter-spacing="1.3" fill="#A5F3FC">CLOUD</text>
        <text x="812" y="407" class="sans" font-size="11.5" fill="#8294AB">AWS · Docker · Events</text>

        <rect x="1014" y="356" width="154" height="69" rx="15" fill="#0B1524" stroke="#244365"/>
        <circle cx="1034" cy="378" r="5" fill="#60A5FA" class="pulse pulse-delay-3"/>
        <text x="1049" y="382" class="mono" font-size="10" font-weight="800" letter-spacing="1.3" fill="#BFDBFE">AI + AUTOMATION</text>
        <text x="1034" y="407" class="sans" font-size="11.5" fill="#8294AB">MCP · Local AI · Tooling</text>
      </g>

      <g class="mono" font-size="9.5" fill="#40536D">
        <text x="783" y="451">SIGNAL: PRODUCTION-DRIVEN</text>
        <text x="1170" y="451" text-anchor="end">MODE: BUILD / AUTOMATE / SCALE</text>
      </g>
    </g>

    <rect x=".5" y=".5" width="1279" height="559" rx="27.5" stroke="#2B3A50"/>
    <path d="M28 1H350" stroke="url(#electric)" stroke-width="2.2" opacity=".85"/>
    <path d="M930 559H1252" stroke="url(#electric)" stroke-width="2.2" opacity=".72"/>
  </g>
</svg>