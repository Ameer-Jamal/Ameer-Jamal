<svg width="1280" height="560" viewBox="0 0 1280 560" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="background" x1="70" y1="20" x2="1210" y2="540" gradientUnits="userSpaceOnUse">
      <stop stop-color="#05070C"/>
      <stop offset="0.48" stop-color="#08111F"/>
      <stop offset="1" stop-color="#050912"/>
    </linearGradient>

    <linearGradient id="nameGradient" x1="80" y1="150" x2="680" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FAFC"/>
      <stop offset="0.42" stop-color="#DCEBFF"/>
      <stop offset="0.7" stop-color="#78B7FF"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>

    <linearGradient id="electric" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#22D3EE"/>
      <stop offset="0.48" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>

    <radialGradient id="core" cx="50%" cy="42%" r="60%">
      <stop offset="0" stop-color="#E0F2FE"/>
      <stop offset="0.18" stop-color="#60A5FA"/>
      <stop offset="0.52" stop-color="#2563EB"/>
      <stop offset="0.78" stop-color="#312E81"/>
      <stop offset="1" stop-color="#050816"/>
    </radialGradient>

    <radialGradient id="ambientBlue" cx="0" cy="0" r="1" gradientTransform="translate(965 260) rotate(90) scale(300)">
      <stop stop-color="#1D4ED8" stop-opacity=".34"/>
      <stop offset="1" stop-color="#1D4ED8" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="ambientViolet" cx="0" cy="0" r="1" gradientTransform="translate(625 520) rotate(90) scale(260)">
      <stop stop-color="#7C3AED" stop-opacity=".18"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#8AB4F8" stroke-opacity=".055" stroke-width="1"/>
    </pattern>

    <pattern id="microGrid" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M10 0H0V10" stroke="#93C5FD" stroke-opacity=".035" stroke-width=".7"/>
    </pattern>

    <filter id="glowStrong" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glowSoft" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>

    <filter id="panelShadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#000000" flood-opacity=".42"/>
    </filter>

    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" seed="8" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 .035"/>
      </feComponentTransfer>
    </filter>

    <clipPath id="viewportClip">
      <rect x="0" y="0" width="1280" height="560" rx="28"/>
    </clipPath>

    <clipPath id="atlasClip">
      <rect x="745" y="66" width="465" height="418" rx="28"/>
    </clipPath>

    <style>
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }

      .orbit-slow {
        transform-box: fill-box;
        transform-origin: center;
        animation: orbitSlow 28s linear infinite;
      }
      .orbit-reverse {
        transform-box: fill-box;
        transform-origin: center;
        animation: orbitReverse 22s linear infinite;
      }
      .pulse {
        transform-box: fill-box;
        transform-origin: center;
        animation: pulse 3.2s ease-in-out infinite;
      }
      .pulse-delay-1 { animation-delay: .8s; }
      .pulse-delay-2 { animation-delay: 1.6s; }
      .pulse-delay-3 { animation-delay: 2.4s; }
      .scan {
        animation: scan 6s ease-in-out infinite;
      }
      .shine {
        animation: shine 5.8s ease-in-out infinite;
      }
      .blink {
        animation: blink 1.1s steps(2, start) infinite;
      }
      .float-a {
        animation: floatA 9s ease-in-out infinite;
      }
      .float-b {
        animation: floatB 11s ease-in-out infinite;
      }
      .dash-flow {
        stroke-dasharray: 8 13;
        animation: dashFlow 12s linear infinite;
      }
      .dash-flow-reverse {
        stroke-dasharray: 5 12;
        animation: dashFlowReverse 10s linear infinite;
      }

      @keyframes orbitSlow { to { transform: rotate(360deg); } }
      @keyframes orbitReverse { to { transform: rotate(-360deg); } }
      @keyframes pulse {
        0%, 100% { opacity: .48; transform: scale(.86); }
        50% { opacity: 1; transform: scale(1.14); }
      }
      @keyframes scan {
        0%, 8% { transform: translateY(-430px); opacity: 0; }
        16% { opacity: .62; }
        84% { opacity: .62; }
        92%, 100% { transform: translateY(430px); opacity: 0; }
      }
      @keyframes shine {
        0%, 18% { transform: translateX(-760px) skewX(-18deg); opacity: 0; }
        28% { opacity: .55; }
        55% { transform: translateX(760px) skewX(-18deg); opacity: 0; }
        100% { transform: translateX(760px) skewX(-18deg); opacity: 0; }
      }
      @keyframes blink { 50% { opacity: 0; } }
      @keyframes floatA {
        0%, 100% { transform: translate(0, 0); }
        50% { transform: translate(12px, -10px); }
      }
      @keyframes floatB {
        0%, 100% { transform: translate(0, 0); }
        50% { transform: translate(-10px, 13px); }
      }
      @keyframes dashFlow { to { stroke-dashoffset: -260; } }
      @keyframes dashFlowReverse { to { stroke-dashoffset: 220; } }

      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; }
      }
    </style>
  </defs>

  <g clip-path="url(#viewportClip)">
    <rect width="1280" height="560" rx="28" fill="url(#background)"/>
    <rect width="1280" height="560" rx="28" fill="url(#grid)"/>
    <rect width="1280" height="560" rx="28" fill="url(#microGrid)"/>
    <rect width="1280" height="560" rx="28" filter="url(#noise)" opacity=".8"/>

    <circle cx="965" cy="260" r="300" fill="url(#ambientBlue)"/>
    <circle cx="625" cy="520" r="260" fill="url(#ambientViolet)"/>

    <path d="M-40 490C160 382 292 540 486 421C692 295 800 432 1007 268C1112 185 1215 164 1320 100"
          stroke="url(#electric)" stroke-opacity=".12" stroke-width="2" class="dash-flow"/>

    <g opacity=".72">
      <circle cx="44" cy="38" r="4.5" fill="#FF5F57"/>
      <circle cx="61" cy="38" r="4.5" fill="#FEBC2E"/>
      <circle cx="78" cy="38" r="4.5" fill="#28C840"/>
      <text x="100" y="43" class="mono" font-size="11" letter-spacing="1.5" fill="#64748B">
        ENGINEERING PROFILE / AMEER-JAMAL
      </text>
      <text x="1178" y="43" text-anchor="end" class="mono" font-size="10" letter-spacing="1.6" fill="#64748B">
        SYSTEMS ONLINE
      </text>
      <circle cx="1196" cy="38" r="4" fill="#22C55E" filter="url(#glowStrong)"/>
    </g>

    <g>
      <rect x="68" y="88" width="247" height="30" rx="15" fill="#0B1728" stroke="#1E3A5F"/>
      <circle cx="87" cy="103" r="4.5" fill="#38BDF8" filter="url(#glowStrong)"/>
      <text x="100" y="108" class="mono" font-size="10.5" font-weight="700" letter-spacing="1.8" fill="#93C5FD">
        SENIOR FULL-STACK ENGINEER
      </text>

      <text x="66" y="210" class="sans" font-size="78" font-weight="900" letter-spacing="-3.5" fill="url(#nameGradient)">
        Ameer Jamal
      </text>

      <g clip-path="url(#viewportClip)">
        <rect class="shine" x="-140" y="118" width="96" height="130" fill="white" opacity="0" filter="url(#glowSoft)"/>
      </g>

      <text x="72" y="257" class="sans" font-size="23" font-weight="550" letter-spacing=".1" fill="#C8D5E6">
        I build production systems, AI tooling, and automation
      </text>
      <text x="72" y="291" class="sans" font-size="23" font-weight="550" letter-spacing=".1" fill="#C8D5E6">
        that remove friction from serious engineering work.
      </text>

      <g class="mono" font-size="11.5" font-weight="700" letter-spacing=".8">
        <rect x="70" y="334" width="72" height="30" rx="9" fill="#0A1727" stroke="#184A74"/>
        <text x="106" y="353" text-anchor="middle" fill="#7DD3FC">JAVA</text>

        <rect x="152" y="334" width="122" height="30" rx="9" fill="#0A1727" stroke="#184A74"/>
        <text x="213" y="353" text-anchor="middle" fill="#7DD3FC">SPRING BOOT</text>

        <rect x="284" y="334" width="92" height="30" rx="9" fill="#17122B" stroke="#4C2A7B"/>
        <text x="330" y="353" text-anchor="middle" fill="#C4B5FD">ANGULAR</text>

        <rect x="386" y="334" width="116" height="30" rx="9" fill="#0A1727" stroke="#184A74"/>
        <text x="444" y="353" text-anchor="middle" fill="#7DD3FC">TYPESCRIPT</text>

        <rect x="512" y="334" width="84" height="30" rx="9" fill="#0A1727" stroke="#184A74"/>
        <text x="554" y="353" text-anchor="middle" fill="#7DD3FC">PYTHON</text>

        <rect x="606" y="334" width="62" height="30" rx="9" fill="#21160B" stroke="#66451A"/>
        <text x="637" y="353" text-anchor="middle" fill="#FBBF24">AWS</text>
      </g>

      <g>
        <rect x="70" y="407" width="188" height="50" rx="13" fill="#0C1B31" stroke="#2563EB" filter="url(#panelShadow)"/>
        <text x="96" y="437" class="mono" font-size="12" font-weight="800" letter-spacing="1.3" fill="#DBEAFE">
          BUILD SYSTEMS
        </text>
        <path d="M224 427H238M233 422L238 427L233 432" stroke="#60A5FA" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>

        <text x="286" y="430" class="mono" font-size="11" font-weight="700" letter-spacing="1.5" fill="#64748B">
          OPEN SOURCE
        </text>
        <text x="286" y="451" class="mono" font-size="11" font-weight="700" letter-spacing="1.5" fill="#64748B">
          CLOUD + AI
        </text>

        <line x1="407" y1="413" x2="407" y2="451" stroke="#243247"/>
        <text x="432" y="430" class="mono" font-size="11" font-weight="700" letter-spacing="1.5" fill="#64748B">
          AUTOMATION
        </text>
        <text x="432" y="451" class="mono" font-size="11" font-weight="700" letter-spacing="1.5" fill="#64748B">
          DEVELOPER UX
        </text>
      </g>

      <text x="72" y="512" class="mono" font-size="12" fill="#5F718A">
        &gt; ship useful software<span class="blink">_</span>
      </text>
    </g>

    <g clip-path="url(#atlasClip)">
      <rect x="745" y="66" width="465" height="418" rx="28" fill="#07101D" fill-opacity=".74" stroke="#243247" filter="url(#panelShadow)"/>
      <rect x="760" y="81" width="435" height="388" rx="21" fill="#050A13" fill-opacity=".36" stroke="#142238"/>

      <g class="scan">
        <rect x="760" y="81" width="435" height="2" fill="url(#electric)" opacity=".82" filter="url(#glowStrong)"/>
        <rect x="760" y="82" width="435" height="46" fill="url(#electric)" opacity=".04"/>
      </g>

      <text x="783" y="111" class="mono" font-size="10.5" font-weight="700" letter-spacing="2" fill="#61738D">
