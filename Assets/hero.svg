<svg width="1200" height="440" viewBox="0 0 1200 440" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="440" gradientUnits="userSpaceOnUse">
      <stop stop-color="#05070D"/>
      <stop offset="0.46" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>

    <linearGradient id="accent" x1="120" y1="70" x2="1020" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#58A6FF"/>
      <stop offset="0.5" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>

    <radialGradient id="orbBlue" cx="0" cy="0" r="1" gradientTransform="translate(950 130) rotate(90) scale(220)">
      <stop stop-color="#2563EB" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="orbPurple" cx="0" cy="0" r="1" gradientTransform="translate(310 355) rotate(90) scale(190)">
      <stop stop-color="#7C3AED" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" stroke="#A5B4FC" stroke-opacity="0.075" stroke-width="1"/>
    </pattern>

    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>

    <clipPath id="panelClip">
      <rect x="760" y="72" width="342" height="294" rx="22"/>
    </clipPath>

    <style>
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }
      .node { animation: pulse 2.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .node:nth-of-type(2) { animation-delay: .5s; }
      .node:nth-of-type(3) { animation-delay: 1s; }
      .node:nth-of-type(4) { animation-delay: 1.5s; }
      .node:nth-of-type(5) { animation-delay: 2s; }
      .scan { animation: scan 5s linear infinite; }
      .cursor { animation: blink 1s steps(2, start) infinite; }
      .float-a { animation: floatA 8s ease-in-out infinite; }
      .float-b { animation: floatB 10s ease-in-out infinite; }
      .dash { stroke-dasharray: 9 14; animation: dash 12s linear infinite; }
      @keyframes pulse {
        0%, 100% { opacity: .55; transform: scale(.86); }
        50% { opacity: 1; transform: scale(1.12); }
      }
      @keyframes scan {
        0% { transform: translateY(-310px); opacity: 0; }
        8% { opacity: .8; }
        92% { opacity: .8; }
        100% { transform: translateY(310px); opacity: 0; }
      }
      @keyframes blink { 50% { opacity: 0; } }
      @keyframes floatA {
        0%, 100% { transform: translate(0, 0); }
        50% { transform: translate(18px, -12px); }
      }
      @keyframes floatB {
        0%, 100% { transform: translate(0, 0); }
        50% { transform: translate(-14px, 16px); }
      }
      @keyframes dash { to { stroke-dashoffset: -300; } }
    </style>
  </defs>

  <rect width="1200" height="440" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="440" rx="28" fill="url(#grid)"/>
  <rect width="1200" height="440" rx="28" stroke="#30363D"/>

  <circle class="float-a" cx="952" cy="126" r="220" fill="url(#orbBlue)"/>
  <circle class="float-b" cx="310" cy="352" r="190" fill="url(#orbPurple)"/>

  <path class="dash" d="M46 384C182 326 214 418 360 350C511 280 590 362 728 278C866 194 1002 240 1164 118"
        stroke="url(#accent)" stroke-opacity=".17" stroke-width="2"/>

  <g opacity=".7">
    <circle cx="50" cy="44" r="5" fill="#FF5F57"/>
    <circle cx="68" cy="44" r="5" fill="#FEBC2E"/>
    <circle cx="86" cy="44" r="5" fill="#28C840"/>
    <text x="112" y="49" class="mono" font-size="12" fill="#6E7681">profile://ameer-jamal</text>
  </g>

  <g>
    <rect x="70" y="92" width="102" height="30" rx="15" fill="#0D2037" stroke="#1F6FEB"/>
    <circle cx="88" cy="107" r="5" fill="#3FB950" filter="url(#glow)"/>
    <text x="101" y="112" class="mono" font-size="11" font-weight="700" fill="#79C0FF">ONLINE</text>

    <text x="70" y="180" class="sans" font-size="64" font-weight="900" letter-spacing="3" fill="#F0F6FC">AMEER</text>
    <text x="70" y="244" class="sans" font-size="64" font-weight="900" letter-spacing="3" fill="url(#accent)">JAMAL</text>

    <text x="73" y="286" class="mono" font-size="16" font-weight="700" letter-spacing="2.5" fill="#C9D1D9">
      SENIOR FULL-STACK ENGINEER
    </text>

    <text x="73" y="324" class="mono" font-size="13" fill="#8B949E">
      JAVA  •  SPRING BOOT  •  ANGULAR  •  TYPESCRIPT  •  PYTHON  •  AWS
    </text>

    <text x="73" y="370" class="mono" font-size="14" fill="#79C0FF">
      &gt; building production systems, AI tools, and automation
    </text>
    <rect class="cursor" x="593" y="356" width="9" height="18" rx="1" fill="#58A6FF"/>
  </g>

  <g>
    <rect x="760" y="72" width="342" height="294" rx="22" fill="#0A0F1A" fill-opacity=".88" stroke="#30363D"/>
    <rect x="784" y="94" width="118" height="24" rx="12" fill="#111827" stroke="#21262D"/>
    <circle cx="798" cy="106" r="4" fill="#3FB950"/>
    <text x="810" y="110" class="mono" font-size="10" fill="#8B949E">LIVE SYSTEM MAP</text>

    <g clip-path="url(#panelClip)">
      <rect class="scan" x="760" y="72" width="342" height="2" fill="url(#accent)" opacity=".75"/>

      <path d="M846 167L931 132L1013 175L968 252L870 250L846 167Z" stroke="#58A6FF" stroke-opacity=".35"/>
      <path d="M846 167L968 252M931 132L870 250M1013 175L846 167M1013 175L870 250" stroke="#8B5CF6" stroke-opacity=".28"/>
      <path d="M931 132L968 252" stroke="#22D3EE" stroke-opacity=".28"/>

      <g filter="url(#glow)">
        <circle class="node" cx="846" cy="167" r="8" fill="#58A6FF"/>
        <circle class="node" cx="931" cy="132" r="8" fill="#8B5CF6"/>
        <circle class="node" cx="1013" cy="175" r="8" fill="#22D3EE"/>
        <circle class="node" cx="968" cy="252" r="8" fill="#58A6FF"/>
        <circle class="node" cx="870" cy="250" r="8" fill="#8B5CF6"/>
      </g>

      <g class="mono" font-size="10" fill="#8B949E">
        <text x="811" y="154">BACKEND</text>
        <text x="909" y="112">CLOUD</text>
        <text x="1022" y="178">AI</text>
        <text x="980" y="274">AUTOMATION</text>
        <text x="827" y="274">FRONTEND</text>
      </g>

      <g class="mono" font-size="11">
        <circle cx="792" cy="313" r="4" fill="#3FB950"/>
        <text x="806" y="317" fill="#C9D1D9">systems connected</text>
        <text x="954" y="317" fill="#58A6FF">100%</text>

        <circle cx="792" cy="335" r="4" fill="#3FB950"/>
        <text x="806" y="339" fill="#C9D1D9">build pipeline</text>
        <text x="954" y="339" fill="#58A6FF">ready</text>
      </g>
    </g>
  </g>

  <g opacity=".55">
    <rect x="1124" y="72" width="8" height="8" rx="2" fill="#58A6FF"/>
    <rect x="1140" y="72" width="8" height="8" rx="2" fill="#8B5CF6"/>
    <rect x="1156" y="72" width="8" height="8" rx="2" fill="#22D3EE"/>
  </g>
</svg>
