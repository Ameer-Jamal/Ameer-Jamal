<svg width="1280" height="86" viewBox="0 0 1280 86" fill="none" xmlns="http://www.w3.org/2000/svg">
  <svg x="315" y="9" width="650" height="68" viewBox="0 0 650 68" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="650" y2="68">
      <stop stop-color="#07101D"/>
      <stop offset="1" stop-color="#0A1423"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="650" y2="0">
      <stop stop-color="#7DD3FC" stop-opacity=".85"/>
      <stop offset=".5" stop-color="#3B82F6" stop-opacity=".45"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity=".25"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }
      .pulse { animation:pulse 3s ease-in-out infinite; }
      .arrow { animation:arrow 2.4s ease-in-out infinite; }
      @keyframes pulse { 0%,100%{opacity:.45} 50%{opacity:1} }
      @keyframes arrow { 0%,100%{transform:translateX(0)} 50%{transform:translateX(4px)} }
      @media (prefers-reduced-motion: reduce) { * { animation:none!important; } }
    </style>
  </defs>
  <rect x=".5" y=".5" width="649" height="67" rx="15.5" fill="url(#bg)" stroke="#243247"/>
  <path d="M16 1H634" stroke="url(#edge)" stroke-width="2"/>
  <rect x="14" y="10" width="56" height="48" rx="12" fill="#0B1727" stroke="#7DD3FC" stroke-opacity=".35"/>
  <text x="42" y="42" text-anchor="middle" class="sans" font-size="23" font-weight="900" fill="#7DD3FC">&lt;&gt;</text>
  <circle cx="623" cy="34" r="4" fill="#7DD3FC" filter="url(#glow)" class="pulse"/>
  <text x="88" y="29" class="mono" font-size="12" font-weight="800" letter-spacing="1.4" fill="#E5EEF9">EXPLORE ALL REPOSITORIES</text>
  <text x="88" y="48" class="sans" font-size="11.5" fill="#8294AB">Browse every public project, experiment, and utility</text>
  <g class="arrow">
    <path d="M598 34H614M608 28L614 34L608 40"
          stroke="#7DD3FC" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
</svg>