<svg width="1280" height="104" viewBox="0 0 1280 104" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="104">
      <stop stop-color="#050A12"/>
      <stop offset=".5" stop-color="#0A1424"/>
      <stop offset="1" stop-color="#050A12"/>
    </linearGradient>
    <linearGradient id="line" x1="70" y1="0" x2="1210" y2="0">
      <stop stop-color="#22D3EE"/>
      <stop offset=".5" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip"><rect width="1280" height="104" rx="18"/></clipPath>
    <style>
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }
      .flow { stroke-dasharray: 8 14; animation: flow 9s linear infinite; }
      .pulse { animation: pulse 2.8s ease-in-out infinite; }
      .pulse2 { animation-delay: .9s; }
      .pulse3 { animation-delay: 1.8s; }
      .marquee { animation: marquee 18s linear infinite; }
      @keyframes flow { to { stroke-dashoffset: -260; } }
      @keyframes pulse { 0%,100%{opacity:.35} 50%{opacity:1} }
      @keyframes marquee { from { transform: translateX(0); } to { transform: translateX(-640px); } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>
