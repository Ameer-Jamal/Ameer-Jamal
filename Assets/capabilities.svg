<svg width="1280" height="410" viewBox="0 0 1280 410" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="20" y1="10" x2="1260" y2="400">
      <stop stop-color="#050A12"/>
      <stop offset=".54" stop-color="#08111E"/>
      <stop offset="1" stop-color="#050912"/>
    </linearGradient>
    <linearGradient id="a" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#22D3EE"/>
      <stop offset=".5" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <radialGradient id="ambient" cx="0" cy="0" r="1" gradientTransform="translate(640 210) rotate(90) scale(230 500)">
      <stop stop-color="#1D4ED8" stop-opacity=".16"/>
      <stop offset="1" stop-color="#1D4ED8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" stroke="#93C5FD" stroke-opacity=".045"/>
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity=".4"/>
    </filter>
    <clipPath id="clip"><rect width="1280" height="410" rx="22"/></clipPath>
    <style>
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }
      .pulse { transform-box: fill-box; transform-origin:center; animation:pulse 3s ease-in-out infinite; }
      .p2 { animation-delay:.8s; } .p3 { animation-delay:1.6s; } .p4 { animation-delay:2.4s; }
      .scan { animation:scan 6s ease-in-out infinite; }
      .dash { stroke-dasharray:7 13; animation:dash 10s linear infinite; }
      @keyframes pulse { 0%,100%{opacity:.38;transform:scale(.84)} 50%{opacity:1;transform:scale(1.12)} }
      @keyframes scan { 0%,8%{transform:translateY(-410px);opacity:0} 18%,82%{opacity:.5} 92%,100%{transform:translateY(410px);opacity:0} }
      @keyframes dash { to { stroke-dashoffset:-240; } }
      @media (prefers-reduced-motion: reduce) { * { animation:none!important; } }
    </style>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1280" height="410" rx="22" fill="url(#bg)"/>
    <rect width="1280" height="410" rx="22" fill="url(#grid)"/>
    <rect width="1280" height="410" rx="22" fill="url(#ambient)"/>
    <rect class="scan" x="0" y="0" width="1280" height="2" fill="url(#a)" filter="url(#glow)"/>

    <text x="50" y="54" class="mono" font-size="11" font-weight="700" letter-spacing="2.1" fill="#60738F">ENGINEERING SURFACE AREA</text>
    <text x="1230" y="54" text-anchor="end" class="mono" font-size="10" letter-spacing="1.7" fill="#40536D">BUILD / AUTOMATE / SCALE</text>

    <g filter="url(#shadow)">
      <rect x="42" y="82" width="575" height="124" rx="18" fill="#081321" stroke="#244365"/>
      <rect x="633" y="82" width="605" height="124" rx="18" fill="#0B1020" stroke="#3B2A63"/>
      <rect x="42" y="222" width="355" height="146" rx="18" fill="#081321" stroke="#1E5264"/>
      <rect x="413" y="222" width="405" height="146" rx="18" fill="#07111E" stroke="#244365"/>
      <rect x="834" y="222" width="404" height="146" rx="18" fill="#0B1020" stroke="#3B2A63"/>
    </g>

    <path d="M175 144H500M746 144H1110M220 294H350M542 294H746M962 294H1175" stroke="url(#a)" stroke-opacity=".15" class="dash"/>

    <g>
      <circle cx="82" cy="121" r="8" fill="#38BDF8" filter="url(#glow)" class="pulse"/>
      <text x="105" y="126" class="mono" font-size="11" font-weight="800" letter-spacing="1.7" fill="#7DD3FC">PRODUCT ENGINEERING</text>
      <text x="82" y="160" class="sans" font-size="22" font-weight="750" fill="#E5EEF9">Production applications that stay maintainable</text>
      <text x="82" y="186" class="sans" font-size="13.5" fill="#8FA2B9">Angular and TypeScript interfaces backed by Java and Spring Boot services.</text>
    </g>

    <g>
      <circle cx="675" cy="121" r="8" fill="#A78BFA" filter="url(#glow)" class="pulse p2"/>
      <text x="698" y="126" class="mono" font-size="11" font-weight="800" letter-spacing="1.7" fill="#C4B5FD">AI DEVELOPER TOOLING</text>
      <text x="675" y="160" class="sans" font-size="22" font-weight="750" fill="#EDE9FE">Context, analysis, and automation for engineers</text>
      <text x="675" y="186" class="sans" font-size="13.5" fill="#9B9AB8">Local models, MCP, code intelligence, failure triage, and workflow acceleration.</text>
    </g>

    <g>
      <circle cx="82" cy="261" r="8" fill="#22D3EE" filter="url(#glow)" class="pulse p3"/>
      <text x="105" y="266" class="mono" font-size="11" font-weight="800" letter-spacing="1.6" fill="#A5F3FC">CLOUD SYSTEMS</text>
      <text x="82" y="306" class="sans" font-size="19" font-weight="750" fill="#E0F2FE">AWS architecture</text>
      <text x="82" y="333" class="sans" font-size="13" fill="#8FA2B9">Queues, events, containers,</text>
      <text x="82" y="352" class="sans" font-size="13" fill="#8FA2B9">deployments, and operations.</text>
    </g>

    <g>
      <circle cx="453" cy="261" r="8" fill="#60A5FA" filter="url(#glow)" class="pulse p4"/>
      <text x="476" y="266" class="mono" font-size="11" font-weight="800" letter-spacing="1.6" fill="#BFDBFE">ENGINEERING AUTOMATION</text>
      <text x="453" y="306" class="sans" font-size="19" font-weight="750" fill="#E0E7FF">Remove repetitive work</text>
      <text x="453" y="333" class="sans" font-size="13" fill="#8FA2B9">CI workflows, diagnostics, developer</text>
      <text x="453" y="352" class="sans" font-size="13" fill="#8FA2B9">utilities, and intelligent tooling.</text>
    </g>

    <g>
      <circle cx="874" cy="261" r="8" fill="#A78BFA" filter="url(#glow)" class="pulse p2"/>
      <text x="897" y="266" class="mono" font-size="11" font-weight="800" letter-spacing="1.6" fill="#DDD6FE">DEVELOPER EXPERIENCE</text>
      <text x="874" y="306" class="sans" font-size="19" font-weight="750" fill="#EDE9FE">Make the interface disappear</text>
      <text x="874" y="333" class="sans" font-size="13" fill="#9B9AB8">Extensions, themes, userscripts,</text>
      <text x="874" y="352" class="sans" font-size="13" fill="#9B9AB8">utilities, and frictionless workflows.</text>
    </g>

    <rect x=".5" y=".5" width="1279" height="409" rx="21.5" stroke="#243247"/>
  </g>
</svg>